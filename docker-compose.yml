services:
  db:
    image: pgvector/pgvector:pg16
    container_name: consultor_juridico_db
    restart: always
    environment:
      POSTGRES_USER: consultor
      POSTGRES_PASSWORD: consultor_pass
      POSTGRES_DB: consultor_juridico
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultor -d consultor_juridico"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: consultor_juridico_ollama
    restart: always
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consultor_juridico_app
    environment:
      - ENV=development
      - DEBUG=true
      - POSTGRES_USER=consultor
      - POSTGRES_PASSWORD=consultor_pass
      - POSTGRES_DB=consultor_juridico
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg://consultor:consultor_pass@db:5432/consultor_juridico
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "consultor-juridico version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  ollama_data:
