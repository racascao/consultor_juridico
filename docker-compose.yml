name: consultor_juridico_v02

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: consultor_juridico_v02_db
    restart: always
    environment:
      POSTGRES_USER: consultor
      POSTGRES_PASSWORD: consultor_pass
      POSTGRES_DB: consultor_juridico_v02
    ports:
      - "5434:5432"
    volumes:
      - consultor_juridico_v02_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultor -d consultor_juridico_v02"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consultor_juridico_v02_app
    environment:
      - ENV=development
      - DEBUG=true
      - POSTGRES_USER=consultor
      - POSTGRES_PASSWORD=consultor_pass
      - POSTGRES_DB=consultor_juridico_v02
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg://consultor:consultor_pass@db:5432/consultor_juridico_v02
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "consultor-juridico version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  consultor_juridico_v02_pgdata:
    name: consultor_juridico_v02_pgdata
