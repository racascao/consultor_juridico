services:
  db:
    image: pgvector/pgvector:pg16
    container_name: consultor_juridico_db
    restart: always
    environment:
      POSTGRES_USER: consultor
      POSTGRES_PASSWORD: consultor_pass
      POSTGRES_DB: consultor_juridico
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultor -d consultor_juridico"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: consultor_juridico_ollama
    restart: always
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/usr/local/bin/mvp1-ollama-entrypoint:ro
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CONSULTATION_MODEL: ${OLLAMA_CONSULTATION_MODEL:-ministral-3:3b}
    entrypoint: ["/usr/local/bin/mvp1-ollama-entrypoint"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama show \"$$OLLAMA_EMBEDDING_MODEL\" >/dev/null 2>&1 && ollama show \"$$OLLAMA_CONSULTATION_MODEL\" >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 180
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consultor_juridico_app
    command: ["standby"]
    environment:
      - ENV=development
      - DEBUG=true
      - POSTGRES_USER=consultor
      - POSTGRES_PASSWORD=consultor_pass
      - POSTGRES_DB=consultor_juridico
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg://consultor:consultor_pass@db:5432/consultor_juridico
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CONSULTATION_MODEL=${OLLAMA_CONSULTATION_MODEL:-ministral-3:3b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_TIMEOUT=180
      - EMBEDDING_DIMENSIONS=768
      - RETRIEVAL_LIMIT=10
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
