[project]
name = "consultor-juridico"
version = "0.1.0"
description = "Mecanismo CLI-first de consulta jurídica da Constituição Federal de 1988 e ADCT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "onnxruntime>=1.29.0",
    "transformers>=5.15.1",
    "torch",
]

[project.scripts]
consultor-juridico = "consultor_juridico.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consultor_juridico"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "planalto_integration: integração opt-in com o site oficial do Planalto",
    "parsing_integration: regressão opt-in e somente leitura da captura persistida",
    "retrieval_integration: avaliação opt-in do índice jurídico local",
    "consultation_integration: consulta jurídica local opt-in com Ollama e PostgreSQL",
    "evaluation_integration: benchmark opt-in de avaliação contra corpus local",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
